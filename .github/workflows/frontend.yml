name: Frontend — CI e deploy (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"
          else echo "has_app=false" >> "$GITHUB_OUTPUT"; echo "::notice::Sem package.json ainda — CI/deploy ignorados."; fi

  check:
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    needs: check
    # PRs de forks não recebem secrets — só deploya PRs do próprio repositório
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Endereço principal: placardaquebrada.pages.dev (projeto "placardaquebrada").
      # Cria o projeto Pages na primeira execução; nas seguintes o comando falha por "já existe" e é ignorado.
      - name: Garantir projeto no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages project create placardaquebrada --production-branch=main
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=placardaquebrada --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
      # Endereço antigo (placar-da-quebrada.pages.dev) continua recebendo a versão da main,
      # para não quebrar links já compartilhados nem apagar jogos salvos em aparelhos que usam ele.
      - name: Publicar também no endereço antigo
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=placar-da-quebrada --branch=main --commit-dirty=true
      - name: Comentar URL de preview no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Preview: ${{ steps.deploy.outputs.deployment-url }}`
            })
