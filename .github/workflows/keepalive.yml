name: Supabase — keepalive

# O plano gratuito do Supabase pausa projetos após 7 dias sem atividade.
# Este workflow faz uma leitura leve a cada 3 dias para manter o projeto ativo.
# Obs.: o GitHub desativa workflows agendados após 60 dias sem commits no repositório.

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve na API
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ]; then echo "::notice::VITE_SUPABASE_URL não configurada."; exit 0; fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $status"
