name: Supabase — migrations e Edge Functions

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  pull_request:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false # nunca interromper uma migration no meio

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  # Em PR: mostra o que seria aplicado, sem aplicar
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Migrations pendentes (dry-run)
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

  # Na main: aplica migrations e publica funções
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Publicar Edge Functions
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_ID"
          else
            echo "::notice::Nenhuma Edge Function para publicar."
          fi
